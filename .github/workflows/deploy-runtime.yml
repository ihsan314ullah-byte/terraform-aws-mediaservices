name: Deploy Runtime Config

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-runtime:
    name: Deploy Runtime Config to EC2
    runs-on: ubuntu-latest
    environment: aws-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145185392705:role/GitHubActionsTerraformMediaServicesRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.1

      - name: Terraform init
        run: terraform init -input=false

      - name: Read Terraform outputs and generate runtime env
        run: |
          SRT_TARGET_IP=$(terraform output -raw source_ingest_ip)
          SRT_TARGET_PORT=$(terraform output -raw source_ingest_port)
          HLS_URL=$(terraform output -raw hls_endpoint_url)
          DASH_URL=$(terraform output -raw dash_endpoint_url)

          cat > runtime.env <<EOF
          SRT_TARGET_IP=$SRT_TARGET_IP
          SRT_TARGET_PORT=$SRT_TARGET_PORT
          SRT_LATENCY_MS=2000
          HLS_URL=$HLS_URL
          DASH_URL=$DASH_URL
          JWT_SECRET=${{ secrets.RUNTIME_JWT_SECRET }}
          EOF

      - name: Find EC2 instance by tag
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.EC2_TARGET_TAG_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region "${{ vars.AWS_REGION }}")

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No running EC2 instance found with tag Name=${{ vars.EC2_TARGET_TAG_NAME }}"
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "Found EC2 instance: $INSTANCE_ID"

      - name: Update EC2 .env via SSM
        run: |
          ENV_B64=$(base64 -w0 runtime.env)

          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -e",
              "echo '$ENV_B64' | base64 -d > ${{ vars.EC2_APP_DIR }}/.env",
              "cd ${{ vars.EC2_APP_DIR }}",
              "docker compose restart metrics-api || docker compose up -d",
              "echo 'Runtime .env updated successfully'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Update EC2 runtime .env from Terraform outputs" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text \
            --region "${{ vars.AWS_REGION }}")

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "${{ vars.AWS_REGION }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "${{ vars.AWS_REGION }}"